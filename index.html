<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Studio</title>
</head>
<body>
  <header class="header">
    <a class="header__logo" href="#">Mod</a>
    <nav class="header__nav">
      <ul class="header__menu">
        <li class="header__item"><a class="header__link" href="#biography">Biography</a></li>
        <li class="header__item"><a class="header__link" href="#designers">Designers</a></li>
        <li class="header__item"><a class="header__link" href="#testimonials">Testimonials</a></li>
        <li class="header__item"><a class="header__link" href="#strength" >Strong points</a></li>
      </ul>
    </nav>
  </header>
  
  <main class="main-content">
    <section class="hero">
      <div class="text-content">
        <h1 class="hero__title">Mod Studio</h1>
        <p class="hero__subtitle">Modern Web Studio</p>
      </div>
      <picture class="hero__picture">
        <source 
          media="(min-width: 1024px)" 
          srcset="./img/hero-inside.jpg 1x, ./img/hero-inside@2x.jpg 2x">
        <source 
          media="(min-width: 768px)" 
          srcset="./img/tablet/hero-inside-tablet.jpg 1x, ./img/tablet/hero-inside-tablet@2x.jpg 2x">
        <img class="hero__image" 
          src="./img/mobile/hero-inside-mobile.jpg" 
          srcset="./img/mobile/hero-inside-mobile@2x.jpg 2x, ./img/mobile/hero-inside-mobile@3x.jpg 3x" 
          alt="Интерьер комнаты">
      </picture>
    </section>

    <section class="biography" id="biography">
      
    </section>
  </main>
</body>
</html>
